<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestión Jardinería Adrover</title>
<!--ICONOS-->
<style>
/* Paleta: verde de jardín con arena. Maqueta: barra lateral en escritorio, barra inferior en móvil. */
:root{
  --bg:#f3f5ef; --panel:#ffffff; --ink:#1b2a20; --muted:#5f6b63; --line:#dde4d8;
  --brand:#2e6b3d; --brand-ink:#ffffff; --sand:#b8862f; --soft:#e6eee2;
  --pend-bg:#f4e6c8; --pend-ink:#6e4c0e; --rej-bg:#f2dcd2; --rej-ink:#8a3f16;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a15; --panel:#1a241d; --ink:#e6ede4; --muted:#9aa89e; --line:#2c3a2f;
    --brand:#7fbf8a; --brand-ink:#0f1a12; --sand:#dcb06a; --soft:#22302a;
    --pend-bg:#3a2f18; --pend-ink:#f0d59a; --rej-bg:#3a2218; --rej-ink:#f0b898;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a15; --panel:#1a241d; --ink:#e6ede4; --muted:#9aa89e; --line:#2c3a2f;
  --brand:#7fbf8a; --brand-ink:#0f1a12; --sand:#dcb06a; --soft:#22302a;
  --pend-bg:#3a2f18; --pend-ink:#f0d59a; --rej-bg:#3a2218; --rej-ink:#f0b898;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-left:0;padding-right:0}
h1,h2,b.h{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.9rem;margin:0}
h2{font-size:1.2rem;margin:0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:26px 16px;border-right:1px solid var(--line);
  background:var(--panel);display:flex;flex-direction:column;gap:22px}
.backup{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.backup label{cursor:pointer}
.solo-movil{display:none}
.side nav .corto{display:none}
@media (max-width:760px){.side nav .largo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.side nav .corto{display:inline}}
@media (max-width:760px){.side .backup{display:none}.solo-movil{display:block}.solo-movil .backup{margin-top:4px;flex-direction:row;flex-wrap:wrap}}
.brand{display:flex;gap:12px;align-items:center}
.sync{all:unset;cursor:pointer;font-size:.8rem;color:var(--muted);margin-top:-10px}
.sync:before{content:"● ";color:var(--muted)}.sync.ok:before{color:var(--brand)}.sync.mal:before{color:var(--rej-ink)}
.sync:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:760px){.side .sync{display:none}}
.mark{width:40px;height:40px;border-radius:12px;display:block}
.brand b{display:block;font-family:"Fraunces",Georgia,serif;font-size:1rem}
.brand small{color:var(--muted);font-size:.8rem}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:10px}
.side nav .ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side nav button:hover{background:var(--soft);color:var(--ink)}
.side nav button[aria-current="page"]{background:var(--soft);color:var(--brand);font-weight:600}
.side nav button:focus-visible,.btn:focus-visible,.row:focus-visible,.card:focus-visible,.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{padding:32px max(24px,env(safe-area-inset-right,0px)) 56px max(24px,env(safe-area-inset-left,0px));min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sub{color:var(--muted);margin:4px 0 0}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:9px 16px;border-radius:999px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--rej-ink);border-color:var(--rej-ink)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.icon{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:1.4rem;color:var(--muted)}
.icon:hover{background:var(--soft)}
.search{width:100%;font:inherit;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi span{color:var(--muted);font-size:.85rem}
.kpi b{font:600 1.7rem "Fraunces",Georgia,serif;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2{margin-bottom:12px}
.panel a{color:var(--brand)}
.marcas{display:flex;flex-wrap:wrap;gap:8px}
.marcas label{position:relative;cursor:pointer}
.marcas input{position:absolute;opacity:0;inset:0;cursor:pointer}
.marcas span{display:inline-block;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.9rem;color:var(--ink)}
.marcas input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.marcas input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.galeria img,.mini-foto{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--soft);cursor:zoom-in;display:block}
.mini-foto{width:48px;height:48px;flex:none}
.foto-grande{width:100%;border-radius:12px;display:block;background:var(--soft)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
/* Ayuda (manual dentro de la app) */
.ay-btn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:15;width:40px;height:40px;border-radius:50%;border:2px solid currentColor;font:700 1.15rem/1 system-ui,sans-serif;cursor:pointer}
.ay{line-height:1.55}
.ay h3{margin:22px 0 8px;font-size:1.1rem;scroll-margin-top:72px}
.ay p{margin:0 0 10px}.ay ul,.ay ol{margin:0 0 10px;padding-left:22px}.ay li{margin:3px 0}
.ay-indice{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ay-indice a{padding:6px 12px;border-radius:999px;text-decoration:none;font-size:.88rem;font-weight:600}
.ay-tabla{overflow-x:auto;margin:0 0 12px}.ay table{border-collapse:collapse;width:100%;font-size:.92rem}
.ay th,.ay td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid currentColor;border-color:rgba(128,128,128,.3)}
.ay code{font-size:.9em}
.ay-btn{background:var(--panel);color:var(--brand)}.ay-indice a{background:var(--soft);color:var(--brand)}.ay a{color:var(--brand)}
.panel svg{width:100%;height:auto;display:block}
.bar{fill:var(--brand)}
.axis{stroke:var(--line);stroke-width:1.5}
.val{fill:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.lbl{fill:var(--muted);font-size:12px}
.empresa{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{all:unset;cursor:pointer;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card:hover{border-color:var(--brand)}
.card b{font-family:"Fraunces",Georgia,serif;font-size:1.05rem;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.85rem}
a.ubic{text-decoration:none;padding:2px}.sin-ubic{font-style:italic}
.line{font-size:.92rem;overflow-wrap:anywhere}
.tag{align-self:flex-start;margin-top:6px;font-size:.78rem;background:var(--soft);color:var(--brand);padding:2px 10px;border-radius:999px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:.9rem;background:var(--panel)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.rows{display:flex;flex-direction:column;gap:10px}
.row{all:unset;cursor:pointer;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;
  display:flex;justify-content:space-between;gap:14px;align-items:center;min-width:0}
.row:hover{border-color:var(--brand)}
.row{flex-wrap:wrap}
.row>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 150px}
.row b{overflow-wrap:anywhere}
.rowr{display:flex;align-items:center;gap:10px 12px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.amt{font-variant-numeric:tabular-nums;font-size:1.02rem}
.pill{font-size:.78rem;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.texto{white-space:normal;border-radius:10px;align-self:flex-start;margin-top:4px}
.pill.enviado{background:var(--pend-bg);color:var(--pend-ink)}
.pill.aceptado{background:var(--brand);color:var(--brand-ink)}
.pill.rechazado,.pill.anulada{background:var(--rej-bg);color:var(--rej-ink)}
.pill.pendiente{background:var(--pend-bg);color:var(--pend-ink)}
.pill.cobrada{background:var(--brand);color:var(--brand-ink)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:26px;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.empty p{margin:0}
.overlay{position:fixed;inset:0;background:rgba(10,18,12,.45);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:16px;z-index:20}
.overlay[hidden]{display:none}
#login{background:var(--bg);z-index:40}
#login .sheet{width:min(400px,100%);padding:28px 26px;display:flex;flex-direction:column;gap:14px}
#login .brand{margin-bottom:6px}
#login-err{margin:0;color:var(--rej-ink);font-size:.9rem;min-height:1.2em}
.sheet{background:var(--panel);color:var(--ink);border-radius:20px;width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:0 22px;border:1px solid var(--line)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:2;background:var(--panel);padding:18px 0 10px;margin-bottom:2px}
#sheet-form>.actions:last-child{position:sticky;bottom:0;z-index:2;background:var(--panel);margin-top:0;padding:12px 0 18px;border-top:1px solid var(--line);box-shadow:0 12px 0 var(--panel)}
#sheet-form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid2 .wide{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld span{font-size:.84rem;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea,.line-in{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.fld textarea{resize:vertical}
.lines{display:flex;flex-direction:column;gap:8px}
.lhead,.line-r{display:grid;grid-template-columns:minmax(0,1fr) 82px 110px 34px;gap:8px;align-items:center}
.lhead span{font-size:.8rem;color:var(--muted)}
.line-r input{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
#lines{display:flex;flex-direction:column;gap:8px}
.line-r label{display:block;min-width:0}.line-r label span{display:none}
.totals{margin-left:auto;min-width:240px;display:flex;flex-direction:column;gap:4px}
.totals div{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.totals .grand{color:var(--ink);font-weight:600;border-top:1px solid var(--line);padding-top:6px;font-size:1.05rem}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.grow{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--rej-ink);color:#fff}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:560px){
  .grid2{grid-template-columns:1fr}.grid2>span:empty{display:none}
  .grid2.par{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .lhead{display:none}
  .line-r{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;grid-template-areas:"c c c" "q p x";gap:8px 10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
  .line-r .l-c{grid-area:c}.line-r .l-q{grid-area:q}.line-r .l-p{grid-area:p}.line-r .icon{grid-area:x;align-self:end}
  .line-r label span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
  .line-r input{background:var(--panel)}
  .totals{min-width:0;width:100%}
}
@media (max-width:760px){
  /* Como en una app: la barra de abajo está quieta y solo se desplaza el contenido. Si se desplazara la página
     entera, el iPhone movería la barra al esconder y sacar sus propias barras. */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0}
  main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
  .side{position:relative;order:2;flex:none;align-self:stretch;top:auto;height:auto;border-right:0;border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));flex-direction:row;gap:0;z-index:10}
  .brand{display:none}
  .side nav{flex-direction:row;width:100%;justify-content:space-around;gap:2px}
  .side nav button{flex-direction:column;justify-content:center;gap:3px;font-size:.7rem;line-height:1.2;padding:7px 0 6px;text-align:center;flex:1 1 0;min-width:0;border-radius:12px}
  .side nav .ico{width:22px;height:22px}
  /* Solo en móviles muy estrechos la barra se desliza de lado para que quepan las siete secciones. */
  @media (max-width:340px){.side nav{overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.side nav::-webkit-scrollbar{display:none}.side nav button{flex:0 0 auto;padding:7px 8px 6px}}
  main{padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  h1{font-size:1.6rem;line-height:1.3}
  /* Cabecera: el título arriba (con hueco para la ayuda) y debajo la explicación con el botón de crear. */
  header.pagehead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;margin-bottom:16px}
  header.pagehead>div:first-child{display:contents}
  header.pagehead h1{grid-column:1/-1;padding-right:48px}
  header.pagehead .sub{margin:0}
  .ay-btn{position:absolute;top:calc(16px + env(safe-area-inset-top,0px))}
  .panel{padding:16px;border-radius:16px}
  .split{gap:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 14px}
  .kpi b{font-size:1.35rem}
  .kpi:last-child:nth-child(odd){grid-column:1/-1}
  .row{padding:14px 16px}
  /* Botones y casillas del tamaño de un dedo. */
  .btn{padding:10px 18px}
  .btn.small{padding:9px 14px}
  .chip{padding:9px 15px}
  .icon{width:40px;height:40px}
  .marcas span{padding:9px 14px}
  .ay-indice a{padding:8px 13px}
  /* Con letra de 16 px el iPhone no amplía la pantalla al escribir. */
  .fld input,.fld select,.fld textarea,.line-r input,.search{font-size:16px}
  /* Las fichas ocupan la pantalla de abajo arriba, como en una app. */
  .overlay:not(#login){padding:0;place-items:end center}
  .overlay:not(#login) .sheet{width:100%;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);border-radius:20px 20px 0 0;border-bottom:0;padding:0 16px}
  #sheet-form>.actions:last-child{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img class="mark" src="/icon-192.png" alt="">
      <div><b>Jardinería Adrover</b><small>Zones Verdes S.L.</small></div>
    </div>
    <button class="sync" id="sync" data-act="sincronizar" title="Actualizar ahora"><span id="sync-txt">Cargando…</span></button>
    <nav aria-label="Secciones">
      <button data-act="nav" data-view="resumen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span class="largo">Resumen</span><span class="corto" aria-hidden="true">Inicio</span></button>
      <button data-act="nav" data-view="clientes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>Clientes</span></button>
      <button data-act="nav" data-view="proveedores"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6h12v10H2z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><span class="largo">Proveedores</span><span class="corto" aria-hidden="true">Prov.</span></button>
      <button data-act="nav" data-view="presupuestos"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h8M9 17h5"/></svg><span class="largo">Presupuestos</span><span class="corto" aria-hidden="true">Presup.</span></button>
      <button data-act="nav" data-view="notas"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h3"/></svg><span>Notas</span></button>
      <button data-act="nav" data-view="partes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 2h6v4H9z"/><path d="M9 13l2 2 4-4"/></svg><span>Partes</span></button>
      <button data-act="nav" data-view="equipo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><circle cx="17" cy="7" r="2.8"/><path d="M17.5 13c2.8.2 4.5 2 4.5 5"/></svg><span>Equipo</span></button>
    </nav>
    <div class="backup">
      <button class="btn small" data-act="copias">Copias de seguridad</button>
      <button class="btn small" data-act="export">Descargar copia</button>
      <label class="btn small">Cargar copia<input class="imp" type="file" accept="application/json" hidden></label>
      <p class="meta" style="margin:0;font-size:.78rem">Los datos se guardan en el servidor, con una copia automática cada noche.</p>
      <button class="btn small ghost" data-act="salir">Cerrar sesión</button>
    </div>
  </aside>
  <main><button class="ay-btn" data-act="ayuda" aria-label="Ayuda" title="Ayuda">?</button><div id="view"></div></main>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon" data-act="close" aria-label="Cerrar">×</button></div>
    <form id="sheet-form" autocomplete="off"></form>
  </div>
</div>
<div id="login" class="overlay" hidden>
  <form class="sheet" id="login-form" autocomplete="on">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>/*CONSTANTES*/</script>
<script>
(function(){
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n) || 0;
const eur = n => num(n).toLocaleString('es-ES', {style:'currency', currency:'EUR'});
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtFecha = f => f ? new Date(f + 'T12:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'}) : '';
// Tipos de IVA que se pueden elegir en cada documento; los antiguos, sin tipo guardado, son del 21 %.
const IVAS = [21, 10, 4, 0];
const ivaDe = p => p.iva ?? 21;
// Presupuestos y notas funcionan igual; cambian el número, los estados y el título del PDF.
// La nota es un documento interno, no una factura (las facturas requieren VERI*FACTU).
const DOCS = {
  presupuestos: {uno: 'presupuesto', Uno: 'Presupuesto', Varios: 'Presupuestos', pdf: 'PRESUPUESTO', pref: 'P', inicial: 'borrador',
    estados: {borrador: 'Borrador', enviado: 'Enviado', aceptado: 'Aceptado', rechazado: 'Rechazado'}, alCompartir: ['borrador', 'enviado']},
  notas: {una: true, uno: 'nota', Uno: 'Nota', Varios: 'Notas', pdf: 'NOTA', pref: 'N', inicial: 'pendiente',
    estados: {pendiente: 'Pendiente de cobro', cobrada: 'Cobrada', anulada: 'Anulada'},
    aviso: 'Este documento no es una factura.'},
};
const S = {clientes:{}, proveedores:{}, presupuestos:{}, notas:{}, partes:{}, ajustes:{}, operarios:{}, fichajes:{}, gastos:{}, fotos:{}};
const APP_EQUIPO = 'https://equipo.jardineriaadrover.workers.dev';
const COLS = Object.keys(S);
let db = null, loaded = 0, view = 'resumen', lastView = '', estadoF = 'todos', q = '', sheetSave = null, sheetDel = null;

const totalsOf = (lines, iva = 21) => {
  const sub = (lines || []).reduce((a, l) => a + num(l.cantidad) * num(l.precio), 0);
  return {sub, iva: sub * iva / 100, total: sub * (1 + iva / 100)};
};
const clienteNombre = id => (S.clientes[id] && S.clientes[id].nombre) || '(sin cliente)';
const byNombre = (a, b) => (a[1].nombre || '').localeCompare(b[1].nombre || '', 'es');
const clienteOpts = () => [['', 'Elige un cliente'], ...Object.entries(S.clientes).sort(byNombre).map(([k, c]) => [k, c.nombre])];
// Numeración por año: P-2026-001 para presupuestos, N-2026-001 para notas.
const nextNumero = (kind, fecha) => {
  const y = (fecha || today()).slice(0, 4), pre = DOCS[kind].pref + '-' + y + '-';
  const max = Object.values(S[kind]).map(p => String(p.numero || ''))
    .filter(n => n.startsWith(pre)).map(n => parseInt(n.split('-')[2], 10) || 0).reduce((a, b) => Math.max(a, b), 0);
  return pre + String(max + 1).padStart(3, '0');
};
const empty = (titulo, texto) => `<div class="empty"><b>${esc(titulo)}</b><p>${esc(texto)}</p></div>`;

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, 3200);
}

const put = (col, id, data) => { if (!db) throw new Error('Sin conexión con la base de datos.'); return db.collection(col).doc(id).set(data); };
const del = (col, id) => { if (!db) throw new Error('Sin conexión con la base de datos.'); return db.collection(col).doc(id).delete(); };
const readObj = fd => Object.fromEntries([...fd.entries()].map(([k, v]) => [k, String(v).trim()]));
const linesFrom = fd => {
  const c = fd.getAll('lc'), cq = fd.getAll('lq'), cp = fd.getAll('lp');
  return c.map((x, i) => ({concepto: String(x).trim(), cantidad: num(cq[i]), precio: num(cp[i])})).filter(l => l.concepto);
};

/* ---------- Formularios ---------- */
function fld(name, label, o = {}) {
  const v = o.value ?? '';
  const cls = 'fld' + (o.wide ? ' wide' : '');
  let input;
  if (o.area) input = `<textarea name="${name}" rows="2">${esc(v)}</textarea>`;
  else if (o.options) input = `<select name="${name}">${o.options.map(([val, txt]) => `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(txt)}</option>`).join('')}</select>`;
  else input = `<input name="${name}" type="${o.type || 'text'}" value="${esc(v)}"${o.req ? ' required' : ''}${o.step ? ` step="${o.step}" min="0"` : ''}>`;
  return `<label class="${cls}"><span>${esc(label)}</span>${input}</label>`;
}
function contactoHtml(v = {}, extra = '') {
  return `<div class="grid2">
    ${fld('nombre', 'Nombre o razón social', {req:1, value:v.nombre, wide:1})}
    ${fld('cif', 'CIF / NIF', {value:v.cif})}
    ${fld('contacto', 'Persona de contacto', {value:v.contacto})}
    ${fld('email', 'Correo electrónico', {type:'email', value:v.email})}
    ${fld('telefono', 'Teléfono', {type:'tel', value:v.telefono})}
    ${fld('direccion', 'Dirección', {value:v.direccion, wide:1})}
    ${fld('cp', 'C.P.', {value:v.cp})}
    ${fld('poblacion', 'Población', {value:v.poblacion})}
    ${fld('provincia', 'Provincia', {value:v.provincia})}
    ${extra}
    ${fld('notas', 'Notas', {area:1, value:v.notas, wide:1})}
  </div>`;
}
function openSheet(title, html, onSave, onDel) {
  $('#sheet-title').textContent = title;
  $('#sheet-form').innerHTML = html + `<div class="actions">${onDel ? '<button type="button" class="btn danger" data-act="del">Eliminar</button>' : ''}<span class="grow"></span><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn primary">Guardar</button></div>`;
  sheetSave = onSave; sheetDel = onDel;
  $('#overlay').hidden = false; $('#overlay .sheet').scrollTop = 0;
  const first = $('#sheet-form input, #sheet-form select, #sheet-form textarea');
  if (first && matchMedia('(hover: hover)').matches) first.focus();
}
function closeSheet() { $('#overlay').hidden = true; $('#sheet-form').innerHTML = ''; sheetSave = sheetDel = null; }

function contactSheet(kind, id) {
  const isC = kind === 'clientes';
  const v = id ? S[kind][id] || {} : {};
  const extra = isC ? '' : fld('categoria', 'Tipo de proveedor', {value:v.categoria, wide:1});
  openSheet((id ? 'Editar ' : 'Nuevo ') + (isC ? 'cliente' : 'proveedor'), contactoHtml(v, extra), async fd => {
    const d = readObj(fd);
    if (!d.nombre) throw new Error('El nombre es obligatorio.');
    await put(kind, id || uid(isC ? 'c' : 'v'), d);
  }, id ? () => {
    if (isC) {
      const n = ['presupuestos', 'notas', 'partes'].reduce((a, k) => a + Object.values(S[k]).filter(p => p.clienteId === id).length, 0);
      if (n && !window.confirm('Este cliente tiene ' + (n === 1 ? '1 documento' : n + ' documentos') + ' (presupuestos, notas o partes). Si lo eliminas, aparecerá' + (n === 1 ? '' : 'n') + ' como «(sin cliente)». ¿Eliminar igualmente?')) return Promise.reject(new Error('No se ha eliminado.'));
    }
    return del(kind, id);
  } : null);
}

function lineRow(l = {}) {
  return `<div class="line-r"><label class="l-c"><span>Concepto</span><input name="lc" value="${esc(l.concepto)}" placeholder="Concepto" aria-label="Concepto"></label><label class="l-q"><span>Cantidad</span><input name="lq" type="number" min="0" step="0.01" value="${l.cantidad ?? 1}" aria-label="Cantidad"></label><label class="l-p"><span>Precio sin IVA</span><input name="lp" type="number" min="0" step="0.01" value="${l.precio ?? 0}" aria-label="Precio sin IVA"></label><button type="button" class="icon" data-act="rmline" aria-label="Quitar línea">×</button></div>`;
}
function updateTotals(form) {
  const fd = new FormData(form), pct = Number(fd.get('iva') ?? 21);
  const t = totalsOf(linesFrom(fd), pct);
  $('#totals', form).innerHTML = `<div><span>Base imponible</span><b>${eur(t.sub)}</b></div><div><span>IVA ${pct} %</span><b>${eur(t.iva)}</b></div><div class="grand"><span>Total</span><b>${eur(t.total)}</b></div>`;
}
// «base» rellena un documento nuevo con las líneas de otro (Duplicar, o crear una nota desde un presupuesto).
function docSheet(kind, id, base) {
  const K = DOCS[kind];
  const v = id ? S[kind][id] || {} : {fecha: today(), estado: K.inicial, ...(base ? {clienteId: base.clienteId, lineas: base.lineas, notas: base.notas, origen: base.origen, iva: base.iva, partes: base.partes} : {})};
  const ls = v.lineas && v.lineas.length ? v.lineas : [{concepto:'', cantidad:1, precio:0}];
  const botones = id ? `<div class="actions" style="margin:0">
      <button type="button" class="btn small" data-act="pdf" data-k="${kind}" data-id="${esc(id)}">Descargar PDF</button>
      <button type="button" class="btn small ghost" data-act="dup" data-k="${kind}" data-id="${esc(id)}">Duplicar</button>
      ${kind === 'presupuestos' ? `<button type="button" class="btn small ghost" data-act="a-nota" data-id="${esc(id)}">Crear nota</button>` : ''}</div>` : '';
  const deDonde = [v.origen && 'Hecha a partir del presupuesto ' + v.origen, (v.partes || []).length && 'Incluye ' + (v.partes.length === 1 ? '1 parte' : v.partes.length + ' partes') + ' de trabajo'].filter(Boolean).join(' · ');
  const html = `${botones}${deDonde ? `<p class="meta" style="margin:0">${esc(deDonde)}</p>` : ''}<div class="grid2">
      ${fld('clienteId', 'Cliente', {options:clienteOpts(), value:v.clienteId, wide:1})}
      ${fld('fecha', 'Fecha', {type:'date', value:v.fecha})}
      ${fld('estado', 'Estado', {options:Object.entries(K.estados), value:v.estado || K.inicial})}
      ${fld('iva', 'IVA', {options:IVAS.map(x => [x, x + ' %']), value:ivaDe(v)})}
    </div>
    <div class="lines">
      <div class="lhead"><span>Concepto</span><span>Cantidad</span><span>Precio sin IVA</span><span></span></div>
      <div id="lines">${ls.map(lineRow).join('')}</div>
      <div><button type="button" class="btn ghost small" data-act="addline">+ Añadir línea</button></div>
    </div>
    <div class="totals" id="totals"></div>
    <div class="grid2">${fld('notas', 'Observaciones', {area:1, value:v.notas, wide:1})}</div>`;
  const titulo = id ? K.Uno + ' ' + (v.numero || '') : base && !base.origen ? 'Copia de ' + (base.numero || K.uno) : (K.una ? 'Nueva ' : 'Nuevo ') + K.uno;
  openSheet(titulo, html, async fd => {
    if (!fd.get('clienteId')) throw new Error('Elige un cliente.');
    const lineas = linesFrom(fd);
    if (!lineas.length) throw new Error('Añade al menos una línea con concepto.');
    const fecha = fd.get('fecha') || today();
    const cli = S.clientes[fd.get('clienteId')] || {};
    // Una nota debe identificar al cliente por completo.
    if (kind === 'notas') {
      const falta = [['cif', 'NIF/CIF'], ['direccion', 'dirección'], ['cp', 'código postal'], ['poblacion', 'población']].filter(([k]) => !String(cli[k] || '').trim()).map(([, n]) => n);
      if (falta.length) throw new Error('Faltan datos del cliente: ' + falta.join(', ') + '. Complétalos en Clientes.');
    }
    // Se guarda una copia de los datos del cliente: el documento sigue igual aunque luego se cambie la ficha.
    const cliente = Object.fromEntries(['nombre', 'cif', 'direccion', 'cp', 'poblacion', 'provincia', 'telefono', 'email', 'contacto'].map(k => [k, String(cli[k] || '').trim()]));
    const {id: _, ...antes} = v, numero = v.numero || nextNumero(kind, fecha);
    await put(kind, id || uid(K.pref.toLowerCase()), {
      ...antes, numero, clienteId: fd.get('clienteId'), cliente, fecha,
      estado: fd.get('estado'), iva: Number(fd.get('iva')), lineas, notas: String(fd.get('notas') || '').trim()
    });
    // Los partes incluidos quedan marcados con el número de la nota, para no cobrarlos dos veces.
    if (!id) for (const pid of v.partes || []) { const p = S.partes[pid]; if (p && !p.nota) { const {id: __, ...dp} = p; await put('partes', pid, {...dp, nota: numero}); } }
  }, id ? () => del(kind, id) : null);
  updateTotals($('#sheet-form'));
}
// Misma ficha que la del jefe de cuadrilla en la app: horario, quién ha ido y tareas, con el mismo cálculo
// de horas (duración × personas). Los partes antiguos sin horario guardan las horas a mano.
const aMin = h => +h.slice(0, 2) * 60 + +h.slice(3);
function parteSheet(id) {
  const v = id ? S.partes[id] || {} : {fecha: today()};
  const deApp = v.origen === 'equipo';
  const quien = new Set(v.operarios || []);
  const personas = Object.entries(S.operarios).filter(([k, o]) => o.activo !== false || quien.has(k)).sort(byNombre);
  const marcas = (name, items, sel) => `<div class="marcas">${items.map(([val, txt]) => `<label><input type="checkbox" name="${name}" value="${esc(val)}"${sel(val) ? ' checked' : ''}><span>${esc(txt)}</span></label>`).join('')}</div>`;
  const info = deApp ? `<p class="meta" style="margin:0">Enviado desde la app del equipo por ${esc(v.autor || '')}${v.editadoOficina ? ' · corregido por la oficina' : ''}</p>` : '';
  const html = `${id ? `<div class="actions" style="margin:0"><button type="button" class="btn small" data-act="pdf-parte" data-id="${esc(id)}">Descargar PDF</button>
      <button type="button" class="btn small ghost" data-act="parte-nota" data-id="${esc(id)}">Crear nota</button></div>` : ''}${info}
    <div class="grid2">
      ${fld('clienteId', 'Cliente', {options:clienteOpts(), value:v.clienteId, wide:1})}
      ${fld('fecha', 'Fecha', {type:'date', value:v.fecha})}
      <span></span>
    </div>
    <div class="grid2 par">
      ${fld('inicio', 'Empezamos', {type:'time', value:v.inicio})}
      ${fld('fin', 'Terminamos', {type:'time', value:v.fin})}
    </div>
    <div class="fld"><span>Quién ha ido</span>${personas.length ? marcas('operarios', personas.map(([k, o]) => [k, o.nombre]), k => quien.has(k)) : '<span class="meta">Da de alta al equipo en Equipo → Personas.</span>'}</div>
    <div class="grid2">
      ${fld('otros', 'Otras personas (opcional)', {value: deApp || (v.operarios || []).length ? '' : v.operario})}
      ${fld('horas', 'Horas en total (solo si no hay horario)', {type:'number', step:'0.25', value: v.inicio ? '' : v.horas})}
    </div>
    <div class="fld"><span>Qué se ha hecho</span>${marcas('tareas', TAREAS.map(t => [t, t]), t => (v.tareas || []).includes(t))}</div>
    <div class="grid2">
      ${fld('descripcion', 'Trabajo realizado', {area:1, value:v.descripcion, wide:1})}
      ${fld('incidencias', 'Avisos para la oficina', {area:1, value:v.incidencias, wide:1})}
    </div>
    ${miniaturas(v.fotos)}`;
  openSheet(id ? 'Parte de trabajo' : 'Nuevo parte de trabajo', html, async fd => {
    if (!fd.get('clienteId')) throw new Error('Elige un cliente.');
    const inicio = fd.get('inicio') || '', fin = fd.get('fin') || '';
    if (!!inicio !== !!fin) throw new Error('Pon la hora de inicio y la de fin, o ninguna de las dos.');
    if (inicio && aMin(fin) <= aMin(inicio)) throw new Error('La hora de fin debe ser posterior a la de inicio.');
    const ops = fd.getAll('operarios'), otros = String(fd.get('otros') || '').trim();
    const nombres = [...ops.map(k => (S.operarios[k] || {}).nombre).filter(Boolean), ...(otros ? [otros] : [])];
    const duracion = inicio ? (aMin(fin) - aMin(inicio)) / 60 : null;
    const horas = duracion !== null ? Math.round(duracion * Math.max(1, ops.length + (otros ? otros.split(',').length : 0)) * 100) / 100 : num(fd.get('horas'));
    const {id: _, ...antes} = v;
    await put('partes', id || uid('t'), {
      ...antes, ...(deApp ? {editadoOficina: Date.now()} : {}),
      fecha: fd.get('fecha') || today(), clienteId: fd.get('clienteId'), inicio, fin, duracion,
      operarios: ops, operario: nombres.join(', '), horas,
      tareas: fd.getAll('tareas'), descripcion: String(fd.get('descripcion') || '').trim(), incidencias: String(fd.get('incidencias') || '').trim()
    });
  }, id ? () => del('partes', id) : null);
}
function empresaSheet() {
  const v = S.ajustes.empresa || {};
  openSheet('Datos de la empresa', `<div class="grid2">
      ${fld('nombre', 'Razón social', {value:v.nombre, wide:1})}
      ${fld('cif', 'CIF', {value:v.cif})}
      ${fld('telefono', 'Teléfono', {type:'tel', value:v.telefono})}
      ${fld('email', 'Correo electrónico', {type:'email', value:v.email})}
      ${fld('direccion', 'Dirección', {value:v.direccion, wide:1})}
      ${fld('cp', 'C.P.', {value:v.cp})}
      ${fld('poblacion', 'Población', {value:v.poblacion})}
      ${fld('precioHora', 'Precio por hora de mano de obra, sin IVA (para pasar partes a notas)', {type:'number', step:'0.01', value:v.precioHora})}
      ${fld('condiciones', 'Condiciones y validez (salen en el PDF)', {area:1, value:v.condiciones, wide:1})}
    </div>`, async fd => { const {id: _, ...antes} = v; await put('ajustes', 'empresa', {...antes, ...readObj(fd)}); }, null);
}

/* ---------- Vistas ---------- */
/* ---------- Datos de ejemplo (para enseñar la aplicación) ---------- */
// Son ejemplo los documentos marcados como tales y todo lo hecho por operarios o para clientes de ejemplo.
function ejemplos() {
  const ops = new Set(Object.entries(S.operarios).filter(([, o]) => o.ejemplo).map(([id]) => id));
  const cli = new Set(Object.entries(S.clientes).filter(([, c]) => c.ejemplo).map(([id]) => id));
  const lista = [];
  for (const col of COLS) for (const [id, d] of Object.entries(S[col] || {}))
    if (d.ejemplo || ops.has(d.operarioId) || ops.has(d.autorId) || cli.has(d.clienteId)) lista.push([col, id]);
  // Operarios y clientes al final: si se corta a medias, lo que queda se sigue reconociendo como ejemplo.
  const ultimo = c => c === 'operarios' || c === 'clientes';
  return lista.sort((a, b) => ultimo(a[0]) - ultimo(b[0]));
}
async function borrarEjemplos(el) {
  const lista = ejemplos();
  if (!lista.length) return;
  if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = '¿Seguro? Pulsa otra vez'; return; }
  el.disabled = true;
  try {
    for (const [i, [col, id]] of lista.entries()) { el.textContent = 'Borrando… ' + (i + 1) + ' de ' + lista.length; await del(col, id); }
    toast('Ejemplos borrados. Tus datos siguen igual.');
  } catch (e) { toast(e.message, true); el.disabled = false; delete el.dataset.sure; el.textContent = 'Borrar ejemplos'; }
}

// Lo que llega de la app del equipo y pide atención de la oficina.
function hoyEquipo() {
  const hoy = today(), ultimo = {};
  for (const f of Object.values(S.fichajes)) if (diaDe(f.ts) === hoy && (!ultimo[f.operarioId] || f.ts > ultimo[f.operarioId].ts)) ultimo[f.operarioId] = f;
  const dentro = Object.values(ultimo).filter(f => f.tipo === 'entrada').sort((a, b) => a.ts - b.ts);
  const avisos = Object.entries(S.partes).filter(([, p]) => p.incidencias && !p.avisoAtendido).sort((a, b) => (b[1].fecha || '').localeCompare(a[1].fecha || ''));
  const gastos = Object.values(S.gastos).filter(g => g.estado !== 'pagado');
  if (!Object.keys(S.operarios).length) return '';
  return `<section class="panel" style="margin-bottom:18px">
    <div class="pagehead" style="margin-bottom:10px"><h2>Hoy en el equipo</h2>${gastos.length ? `<button class="btn small" data-act="ir-gastos">${gastos.length} ${gastos.length === 1 ? 'gasto' : 'gastos'} por pagar · ${eur(gastos.reduce((a, g) => a + num(g.importe), 0))}</button>` : ''}</div>
    <p style="margin:0 0 ${avisos.length ? 14 : 0}px">${dentro.length ? '<b>Trabajando ahora:</b> ' + dentro.map(f => esc((S.operarios[f.operarioId] || {}).nombre || f.operario) + ' <span class="meta">desde las ' + horaDe(f.ts) + lugarF(f) + '</span>').join(' · ') : '<span class="meta">Ahora mismo nadie ha fichado la entrada.</span>'}
      <span class="meta"> · ${Object.keys(ultimo).length} de ${Object.values(S.operarios).filter(o => o.activo !== false).length} han fichado hoy</span></p>

    .then(r => r.ok ? r.blob() : Promise.reject()).then(b => URL.createObjectURL(b)).catch(() => { fotosCache.delete(k); return ''; }));

}

const eur2 = n => num(n).toLocaleString('es-ES', {style: 'currency', currency: 'EUR'});
const dos = n => String(n).padStart(2, '0');
const diaDe = ts => { const d = new Date(ts); return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()); };
const horaDe = ts => new Date(ts).toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
const hm = ms => { const m = Math.round(ms / 60e3); return Math.floor(m / 60) + ' h ' + dos(m % 60) + ' min'; };
// Dónde se fichó: enlace al mapa con el punto que dio el móvil, o por qué no lo dio.
const NO_UBIC = {'denegada': 'el móvil no dio permiso', 'sin señal': 'sin señal GPS', 'no disponible': 'el móvil no lo permite'};
const lugarF = f => !f ? '' : f.lat !== undefined
  ? ` <a class="ubic" href="https://www.google.com/maps/search/?api=1&query=${f.lat},${f.lon}" target="_blank" rel="noopener" title="Ver en el mapa${f.precision ? ' (±' + f.precision + ' m)' : ''}" aria-label="Ver en el mapa dónde fichó">📍</a>`
  : f.sinUbicacion ? ` <span class="sin-ubic" title="${esc(NO_UBIC[f.sinUbicacion] || '')}">(sin ubicación)</span>` : '';
// Días del mes con sus tramos entrada → salida para un operario.
function registro(opId, mes) {
  const fs = Object.values(S.fichajes).filter(f => f.operarioId === opId && diaDe(f.ts).startsWith(mes)).sort((a, b) => a.ts - b.ts);
  const dias = {};
  for (const f of fs) (dias[diaDe(f.ts)] ||= []).push(f);
  return Object.entries(dias).sort().map(([dia, lista]) => {
    const tramos = []; let ab = null, raro = false;
    for (const f of lista) {
      if (f.tipo === 'entrada') { if (ab) { raro = true; tramos.push([ab, null]); } ab = f; }
      else if (ab) { tramos.push([ab, f]); ab = null; } else { raro = true; tramos.push([null, f]); }
    }
    if (ab) { tramos.push([ab, null]); if (dia !== today()) raro = true; }
    const ms = tramos.reduce((a, [e, s]) => a + (e && s ? s.ts - e.ts : 0), 0);
    return {dia, tramos, ms, raro, sinConexion: lista.some(f => f.sinConexion)};
  });
}

let mem = {};
let clave = '';
// La clave se recuerda en este dispositivo hasta pulsar «Cerrar sesión».
try { clave = localStorage.getItem('clave') || sessionStorage.getItem('clave') || ''; } catch (e) {}
let pidiendo = null;
function pedirClave(error) {
  if (pidiendo) return pidiendo;
  return pidiendo = new Promise(resolve => {
    const box = $('#login'), f = $('#login-form');
    $('#login-err').textContent = error || '';
    box.hidden = false;
    f.clave.value = '';
    f.clave.focus();
    f.onsubmit = ev => {
      ev.preventDefault();
      clave = f.clave.value.trim();
      try { localStorage.setItem('clave', clave); } catch (e) {}
      box.hidden = true;
      pidiendo = null;
      resolve();
    };
  });
}
function salir() {
  try { localStorage.removeItem('clave'); sessionStorage.removeItem('clave'); } catch (e) {}
  location.reload();
}
async function api(method, path, body, cabeceras = {}) {
  // Si la clave guardada deja de valer, se vuelve a pedir; si la acaban de escribir mal, se avisa.
  let tecleada = false;
  for (;;) {
    if (!clave) { await pedirClave(); tecleada = true; }
    let r;
    try {
      r = await fetch(path, {method, headers: {'Content-Type': 'application/json', 'X-Clave': clave, ...cabeceras},
        body: body ? JSON.stringify(body) : undefined});
    } catch (e) { throw new Error('Sin conexión. Revisa internet e inténtalo de nuevo.'); }
    if (r.status === 503) throw new Error('Falta configurar la clave de la gestión en Cloudflare.');
    if (r.status === 429) throw new Error('Demasiados intentos con una clave incorrecta. Espera unos minutos.');
    if (r.status === 401) { clave = ''; await pedirClave(tecleada ? 'Clave incorrecta. Inténtalo de nuevo.' : ''); tecleada = true; continue; }
    if (r.status === 409) { const e = new Error('No se ha guardado: mientras lo editabas, la app del equipo u otro ordenador lo cambió. Ábrelo de nuevo para ver lo último.'); e.conflicto = true; throw e; }
    if (!r.ok) throw new Error('El servidor no pudo guardar. Revisa la conexión e inténtalo de nuevo.');
    return r.json();
  }
}
function cargarEnPantalla() {
  COLS.forEach(col => {
    S[col] = Object.fromEntries(Object.entries(mem[col] || {}).map(([id, d]) => [id, {...d, id}]));
  });
  if (loaded < COLS.length) loaded = COLS.length;
  render();
}
db = {
  collection: col => ({
    doc: id => ({
      // Se manda la versión cargada (_v): si alguien lo cambió entretanto, el servidor no lo pisa.
      // «forzar» es para recuperar copias, que deben escribir sí o sí.
      set: async (d, forzar) => {
        const {id: _, _v: __, ...datos} = d, v = !forzar && mem[col] && mem[col][id] && mem[col][id]._v;
        let r;
        try { r = await api('PUT', '/api/doc/' + encodeURIComponent(col) + '/' + encodeURIComponent(id), datos, v ? {'If-Match': v} : {}); }
        catch (e) { if (e.conflicto) { await sincronizar().catch(() => {}); } throw e; }
        mem[col] = mem[col] || {}; mem[col][id] = {...datos, _v: r._v};
        cargarEnPantalla();
      },
      delete: async () => {
        await api('DELETE', '/api/doc/' + encodeURIComponent(col) + '/' + encodeURIComponent(id));
        if (mem[col]) delete mem[col][id];
        cargarEnPantalla();
      }
    })
  })
};
function exportarCopia() {
  const sinVersion = Object.fromEntries(Object.entries(mem).map(([c, docs]) => [c, Object.fromEntries(Object.entries(docs).map(([id, {_v, ...d}]) => [id, d]))]));
  const blob = new Blob([JSON.stringify(sinVersion, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'copia-jardineria-adrover-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Copia descargada');
}
async function importarCopia(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== 'object') throw new Error();
    for (const col of Object.keys(d)) {
      if (!COLS.includes(col)) continue;
      for (const [id, data] of Object.entries(d[col] || {})) await db.collection(col).doc(id).set(data, true);
    }
    toast('Datos cargados');
  } catch (e) { toast('El archivo no es una copia válida.', true); }
}

async function recuperarCopia(f, el) {

      for (const [id, data] of Object.entries(d[col] || {})) await db.collection(col).doc(id).set(data, true);
    }
    closeSheet();
    toast('Datos del ' + fmtFecha(f) + ' recuperados');
  } catch (e) { toast(e.message, true); el.disabled = false; }
}

/* ---------- PDF del presupuesto o la nota ---------- */
const eurPDF = n => num(n).toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';
// El logo se carga al abrir la gestión para que el PDF se pueda generar (y compartir) al instante.
let LOGO = null;
function cargarLogo() {
  fetch('/logo.png').then(r => r.ok ? r.blob() : null).then(b => {
    if (!b) return;
    const fr = new FileReader();
    fr.onload = () => { LOGO = fr.result; };
    fr.readAsDataURL(b);
  }).catch(() => {});
}
function generarPDF(kind, id) {
  const K = DOCS[kind];
  const p = S[kind][id];
  if (!p) return;
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { toast('No se pudo cargar el generador de PDF. Revisa la conexión.', true); return; }
  const e = S.ajustes.empresa || DEFAULT_EMPRESA;
  const c = p.cliente || S.clientes[p.clienteId] || {};
  const d = new J({unit: 'mm', format: 'a4'});
  const L = 18, R = 192, ALTO = 297, PIE = 280, VERDE = [46, 107, 61];
  const txt = (s, x, y, o) => d.text(String(s), x, y, o);
  // Si lo que viene no cabe en la página, pasa a la siguiente.
  const sitio = (h, conCabecera) => {
    if (y + h <= PIE) return;
    d.addPage(); y = 20;
    if (conCabecera) cabeceraTabla();
  };
  const cabeceraTabla = () => {
    d.setFont('helvetica', 'bold'); d.setFontSize(9); d.setTextColor(30, 30, 30);
    txt('Concepto', L, y); txt('Cant.', 128, y, {align: 'right'});
    txt('Precio', 158, y, {align: 'right'}); txt('Importe', R, y, {align: 'right'});
    d.setDrawColor(180); d.line(L, y + 2, R, y + 2);
    d.setFont('helvetica', 'normal');
    y += 3;
  };
  const parrafo = (titulo, texto) => {
    d.setFontSize(9);
    const lineas = d.splitTextToSize(String(texto), R - L);
    sitio(10 + lineas.length * 4.5);
    y += 10;
    d.setFont('helvetica', 'bold'); d.setFontSize(10); txt(titulo, L, y);
    d.setFont('helvetica', 'normal'); d.setFontSize(9);
    lineas.forEach(l => { sitio(4.5); y += 4.5; txt(l, L, y); });
  };

  // Empresa
  let x0 = L;
  if (LOGO) { try { d.addImage(LOGO, 'PNG', L, 12, 20, 20); x0 = L + 25; } catch (err) {} }
  let y = 20;
  d.setFont('helvetica', 'bold'); d.setFontSize(16); d.setTextColor(...VERDE);
  txt(e.nombre || '', x0, y);
  d.setFont('helvetica', 'normal'); d.setFontSize(9); d.setTextColor(60, 60, 60);
  [e.cif && 'CIF ' + e.cif, e.direccion, [e.cp, e.poblacion].filter(Boolean).join(' '), e.telefono, e.email]
    .filter(Boolean).forEach(t => { y += 5; txt(t, x0, y); });
  d.setFont('helvetica', 'bold'); d.setFontSize(13); d.setTextColor(30, 30, 30);
  txt(K.pdf, R, 20, {align: 'right'});
  d.setFont('helvetica', 'normal'); d.setFontSize(10);
  txt('Nº ' + (p.numero || ''), R, 27, {align: 'right'});
  txt('Fecha: ' + fmtFecha(p.fecha), R, 33, {align: 'right'});

  // Cliente, en un recuadro y con etiquetas
  y = Math.max(y, 40) + 10;
  const datosCli = [['NIF/CIF', c.cif], ['Dirección', c.direccion], ['Localidad', [c.cp, c.poblacion, c.provincia && '(' + c.provincia + ')'].filter(Boolean).join(' ')],
    ['Teléfono', c.telefono], ['Correo', c.email], ['Contacto', c.contacto]].filter(([, x]) => x);
  const altoCli = 15 + datosCli.length * 5;
  d.setDrawColor(200); d.setFillColor(246, 248, 244); d.roundedRect(L, y, R - L, altoCli, 2, 2, 'FD');
  d.setFont('helvetica', 'bold'); d.setFontSize(8); d.setTextColor(...VERDE); txt('CLIENTE', L + 4, y + 5);
  d.setFontSize(11); d.setTextColor(30, 30, 30); txt(c.nombre || '(sin cliente)', L + 4, y + 10.5);
  d.setFontSize(9);
  datosCli.forEach(([k, x], i) => {
    d.setFont('helvetica', 'bold'); d.setTextColor(90, 90, 90); txt(k + ':', L + 4, y + 15.5 + i * 5);
    d.setFont('helvetica', 'normal'); d.setTextColor(30, 30, 30); txt(d.splitTextToSize(String(x), R - L - 34)[0], L + 26, y + 15.5 + i * 5);
  });
  d.setTextColor(60, 60, 60);
  y += altoCli + 2;

  // Líneas: el concepto se parte en varias líneas si es largo
  y += 12;
  cabeceraTabla();
  d.setFontSize(9);
  (p.lineas || []).forEach(l => {
    const partes = d.splitTextToSize(String(l.concepto || ''), 95);
    sitio(partes.length * 4.5 + 3, true);
    y += 5;
    txt(num(l.cantidad).toLocaleString('es-ES'), 128, y, {align: 'right'});
    txt(eurPDF(l.precio), 158, y, {align: 'right'});
    txt(eurPDF(num(l.cantidad) * num(l.precio)), R, y, {align: 'right'});
    partes.forEach((t, i) => txt(t, L, y + i * 4.5));
    y += (partes.length - 1) * 4.5 + 1.5;
  });

  // Totales
  const t = totalsOf(p.lineas, ivaDe(p));
  sitio(26);
  d.setDrawColor(180); d.line(128, y + 3, R, y + 3);
  y += 9; txt('Base imponible', 130, y); txt(eurPDF(t.sub), R, y, {align: 'right'});
  y += 6; txt('IVA ' + ivaDe(p) + ' %', 130, y); txt(eurPDF(t.iva), R, y, {align: 'right'});
  y += 7; d.setFont('helvetica', 'bold'); d.setFontSize(11); d.setTextColor(...VERDE);
  txt('Total', 130, y); txt(eurPDF(t.total), R, y, {align: 'right'});
  d.setTextColor(60, 60, 60);

  if (p.origen) parrafo('Referencia', 'Según presupuesto ' + p.origen);
  if (p.notas) parrafo('Observaciones', p.notas);
  if (e.condiciones && kind === 'presupuestos') parrafo('Condiciones', e.condiciones);
  if (K.aviso) { sitio(12); y += 12; d.setFont('helvetica', 'italic'); d.setFontSize(9); txt(K.aviso, L, y); d.setFont('helvetica', 'normal'); }

  // Pie con número de página
  const n = d.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    d.setPage(i); d.setFont('helvetica', 'normal'); d.setFontSize(8); d.setTextColor(140, 140, 140);
    txt([e.nombre, e.telefono, e.email].filter(Boolean).join(' · '), L, ALTO - 10);
    if (n > 1) txt('Página ' + i + ' de ' + n, R, ALTO - 10, {align: 'right'});
  }

  // En el móvil se abre «Compartir» (WhatsApp, correo…); en el ordenador se descarga.
  const nombre = (p.numero || K.uno) + '.pdf';
  const archivo = new File([d.output('blob')], nombre, {type: 'application/pdf'});
  const movil = matchMedia('(pointer:coarse)').matches;
  if (movil && navigator.canShare && navigator.canShare({files: [archivo]})) {
    navigator.share({files: [archivo], title: K.Uno + ' ' + (p.numero || '')}).then(() => {
      if (K.alCompartir && p.estado === K.alCompartir[0]) {
        const {id: _, ...datos} = p;
        db.collection(kind).doc(id).set({...datos, estado: K.alCompartir[1]}).then(() => {
          const sel = $('#sheet-form [name=estado]'); if (sel) sel.value = K.alCompartir[1];
          toast('Marcado como enviado');
        }).catch(() => {});
      }
    }).catch(err => { if (err.name !== 'AbortError') d.save(nombre); });
  } else {
    d.save(nombre);
  }
}

/* ---------- PDF de partes (para adjuntar a una factura o archivar en papel) ---------- */
// Un parte: todos sus datos y fotos. Varios: tabla con el total de horas. Ambos con la firma de la empresa.
// Los avisos para la oficina no salen: son internos.
const blobADatos = b => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(b); });
async function fotoParaPDF(id) {
  try {
    const u = await fotoURL(id, false); if (!u) return null;
    const datos = await blobADatos(await (await fetch(u)).blob());
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = datos; });
    return {datos, ancho: img.naturalWidth, alto: img.naturalHeight};
  } catch (e) { return null; }
}
async function pdfPartes(ids) {
  const partes = ids.map(id => S.partes[id]).filter(Boolean).sort((a, b) => (a.fecha + (a.inicio || '')).localeCompare(b.fecha + (b.inicio || '')));
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!partes.length) return;
  if (!J) return toast('No se pudo cargar el generador de PDF. Revisa la conexión.', true);
  const uno = partes.length === 1, p0 = partes[0];
  if (uno && (p0.fotos || []).length) toast('Preparando el PDF con las fotos…');
  const e = S.ajustes.empresa || DEFAULT_EMPRESA, d = new J({unit: 'mm', format: 'a4'});
  const L = 18, R = 192, ALTO = 297, PIE = 278, VERDE = [46, 107, 61];
  const txt = (t, x, y, o) => d.text(String(t), x, y, o);
  let y = 20;
  const sitio = h => { if (y + h > PIE) { d.addPage(); y = 20; return true; } return false; };
  const horasTxt = h => num(h).toLocaleString('es-ES', {maximumFractionDigits: 2}) + ' h';
  const clientes = [...new Set(partes.map(p => p.clienteId))];

  // Cabecera: empresa a la izquierda, título a la derecha
  let x0 = L;
  if (LOGO) { try { d.addImage(LOGO, 'PNG', L, 12, 20, 20); x0 = L + 25; } catch (err) {} }
  d.setFont('helvetica', 'bold'); d.setFontSize(16); d.setTextColor(...VERDE); txt(e.nombre || '', x0, y);
  d.setFont('helvetica', 'normal'); d.setFontSize(9); d.setTextColor(60, 60, 60);
  [e.cif && 'CIF ' + e.cif, e.direccion, [e.cp, e.poblacion].filter(Boolean).join(' '), e.telefono, e.email].filter(Boolean).forEach(t => { y += 5; txt(t, x0, y); });
  d.setFont('helvetica', 'bold'); d.setFontSize(13); d.setTextColor(30, 30, 30);
  txt(uno ? 'PARTE DE TRABAJO' : 'PARTES DE TRABAJO', R, 20, {align: 'right'});
  d.setFont('helvetica', 'normal'); d.setFontSize(10);
  if (uno) { txt('Fecha: ' + fmtFecha(p0.fecha), R, 27, {align: 'right'}); if (p0.inicio) txt('Horario: ' + p0.inicio + ' – ' + p0.fin, R, 33, {align: 'right'}); }
  else {
    const f1 = fmtFecha(partes[0].fecha), f2 = fmtFecha(partes[partes.length - 1].fecha);
    txt(partesMes ? new Date(partesMes + '-15').toLocaleDateString('es-ES', {month: 'long', year: 'numeric'}) : f1 === f2 ? f1 : f1 + ' – ' + f2, R, 27, {align: 'right'});
    txt(partes.length + ' partes', R, 33, {align: 'right'});
  }

  // Cliente (si todos son del mismo)
  y = Math.max(y, 40) + 10;
  if (clientes.length === 1) {
    const c = S.clientes[clientes[0]] || {};
    const filas = [['NIF/CIF', c.cif], ['Dirección', c.direccion], ['Localidad', [c.cp, c.poblacion, c.provincia && '(' + c.provincia + ')'].filter(Boolean).join(' ')], ['Teléfono', c.telefono]].filter(([, v]) => v);
    const alto = 15 + filas.length * 5;
    d.setDrawColor(200); d.setFillColor(246, 248, 244); d.roundedRect(L, y, R - L, alto, 2, 2, 'FD');
    d.setFont('helvetica', 'bold'); d.setFontSize(8); d.setTextColor(...VERDE); txt('CLIENTE', L + 4, y + 5);
    d.setFontSize(11); d.setTextColor(30, 30, 30); txt(c.nombre || clienteNombre(clientes[0]), L + 4, y + 10.5);
    d.setFontSize(9);
    filas.forEach(([k, v], i) => { d.setFont('helvetica', 'bold'); d.setTextColor(90, 90, 90); txt(k + ':', L + 4, y + 15.5 + i * 5); d.setFont('helvetica', 'normal'); d.setTextColor(30, 30, 30); txt(d.splitTextToSize(String(v), R - L - 34)[0], L + 26, y + 15.5 + i * 5); });
    y += alto + 8;
  }
  d.setTextColor(30, 30, 30);

  if (uno) {
    // Un parte: datos con etiqueta
    const personas = p0.operario || (p0.operarios || []).map(o => (S.operarios[o] || {}).nombre).filter(Boolean).join(', ');
    const filas = [['Personas', personas],
      ['Horas', p0.duracion ? horasTxt(p0.duracion) + ' por persona · ' + horasTxt(p0.horas) + ' en total' : horasTxt(p0.horas)],
      ['Tareas', (p0.tareas || []).join(', ')], ['Trabajo realizado', p0.descripcion]].filter(([, v]) => v);
    for (const [k, v] of filas) {
      const lineas = d.splitTextToSize(String(v), R - L - 40);
      sitio(lineas.length * 5 + 4);
      d.setFont('helvetica', 'bold'); d.setFontSize(10); txt(k, L, y);
      d.setFont('helvetica', 'normal'); lineas.forEach((t, i) => txt(t, L + 40, y + i * 5));
      y += lineas.length * 5 + 4;
    }
    // Fotos, dos por fila
    const fotos = (await Promise.all((p0.fotos || []).map(fotoParaPDF))).filter(Boolean);
    if (fotos.length) {
      sitio(14); y += 4; d.setFont('helvetica', 'bold'); txt('Fotos', L, y); y += 4;
      const anchoCol = (R - L - 6) / 2;
      for (let i = 0; i < fotos.length; i += 2) {
        const par = fotos.slice(i, i + 2), alto = Math.min(80, Math.max(...par.map(f => anchoCol * f.alto / f.ancho)));
        sitio(alto + 4);
        par.forEach((f, j) => {
          const k = Math.min(anchoCol / f.ancho, alto / f.alto);
          try { d.addImage(f.datos, 'JPEG', L + j * (anchoCol + 6), y, f.ancho * k, f.alto * k); } catch (err) {}
        });
        y += alto + 4;
      }
    }
  } else {
    // Varios partes: tabla
    const cols = clientes.length === 1 ? [['Fecha', 26], ['Horario', 24], ['Personas', 40], ['Horas', 16], ['Trabajo', 68]] : [['Fecha', 22], ['Cliente', 36], ['Horario', 22], ['Personas', 34], ['Horas', 14], ['Trabajo', 46]];
    const cabecera = () => {
      d.setFont('helvetica', 'bold'); d.setFontSize(9); let x = L;
      cols.forEach(([t, w]) => { txt(t, t === 'Horas' ? x + w - 2 : x, y, t === 'Horas' ? {align: 'right'} : undefined); x += w; });
      d.setDrawColor(180); d.line(L, y + 2, R, y + 2); y += 7; d.setFont('helvetica', 'normal');
    };
    cabecera();
    for (const p of partes) {
      const celdas = {Fecha: fmtFecha(p.fecha), Cliente: clienteNombre(p.clienteId), Horario: p.inicio ? p.inicio + '–' + p.fin : '', Personas: p.operario || '', Horas: horasTxt(p.horas), Trabajo: [(p.tareas || []).join(', '), p.descripcion].filter(Boolean).join('. ')};
      const partidas = cols.map(([t, w]) => d.splitTextToSize(String(celdas[t] || ''), w - 3));
      const alto = Math.max(...partidas.map(l => l.length)) * 4.3 + 2.5;
      if (sitio(alto)) cabecera();
      let x = L;
      cols.forEach(([t, w], i) => { partidas[i].forEach((l, j) => txt(l, t === 'Horas' ? x + w - 2 : x, y + j * 4.3, t === 'Horas' ? {align: 'right'} : undefined)); x += w; });
      y += alto; d.setDrawColor(225); d.line(L, y - 3, R, y - 3);
    }
    sitio(10); d.setFont('helvetica', 'bold'); d.setFontSize(10);
    txt('Total de horas: ' + horasTxt(partes.reduce((a, p) => a + num(p.horas), 0)), R, y + 2, {align: 'right'}); y += 8;
  }

  // Firma de la empresa, para archivar en papel (el cliente no firma: puede no llegar a ver el parte)
  sitio(36); y += 10; d.setFont('helvetica', 'normal'); d.setFontSize(9); d.setDrawColor(150);
  d.rect(L, y, (R - L - 10) / 2, 22); txt((clientes.length === 1 ? 'Por ' : 'Revisado por ') + (e.nombre || 'la empresa'), L + 3, y + 5);

  // Pie con número de página
  const n = d.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    d.setPage(i); d.setFont('helvetica', 'normal'); d.setFontSize(8); d.setTextColor(140, 140, 140);
    txt([e.nombre, e.telefono, e.email].filter(Boolean).join(' · '), L, ALTO - 10);
    if (n > 1) txt('Página ' + i + ' de ' + n, R, ALTO - 10, {align: 'right'});
  }

  // En el móvil se abre «Compartir»; en el ordenador se descarga.
  const cli = clientes.length === 1 ? '-' + clienteNombre(clientes[0]).replace(/\(Ejemplo\)/, '').trim().replace(/[^\wáéíóúñü]+/gi, '-').toLowerCase() : '';
  const nombre = (uno ? 'parte-' + p0.fecha : 'partes-' + (partesMes || p0.fecha)) + cli + '.pdf';
  const archivo = new File([d.output('blob')], nombre, {type: 'application/pdf'});
  if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files: [archivo]})) {
    navigator.share({files: [archivo], title: uno ? 'Parte de trabajo' : 'Partes de trabajo'}).catch(err => { if (err.name !== 'AbortError') d.save(nombre); });
  } else d.save(nombre);
}

/* ---------- Sincronización con el servidor ---------- */
// Solo se piden los cambios desde la última vez (con 2 minutos de solape, por si algo se guardaba
// justo en ese momento: recibir dos veces lo mismo no estropea nada).
let marca = null;
let ultimaSync = 0, syncFallo = false;
function pintarSync() {
  const el = $('#sync'); if (!el || !ultimaSync) return;
  const min = Math.round((Date.now() - ultimaSync) / 60e3);
  el.className = 'sync ' + (syncFallo ? 'mal' : 'ok');
  $('#sync-txt').textContent = (syncFallo ? 'Sin conexión' : 'Al día') + ' · actualizado ' + (min < 1 ? 'ahora mismo' : min < 60 ? 'hace ' + min + ' min' : 'a las ' + horaDe(ultimaSync));
}
setInterval(pintarSync, 30e3);
async function sincronizar() {
  if (!marca) return;
  let r;
  try { r = await api('GET', '/api/datos?desde=' + encodeURIComponent(marca)); }
  catch (e) { syncFallo = true; pintarSync(); throw e; }
  ultimaSync = Date.now(); syncFallo = false; pintarSync();
  for (const [col, id, d] of r.cambios) (mem[col] ||= {})[id] = d;
  for (const [col, id] of r.borrados) if (mem[col]) delete mem[col][id];
  marca = new Date(Date.parse(r.hasta) - 120e3).toISOString();
  if (r.cambios.length || r.borrados.length) cargarEnPantalla();
}

/* ---------- Arranque ---------- */
(async function init() {
  $('#view').innerHTML = empty('Cargando…', 'Conectando con el servidor.');
  try {
    mem = await api('GET', '/api/datos');
  } catch (e) {
    $('#view').innerHTML = empty('No se han podido cargar los datos.', e.message + ' Vuelve a abrir la página para reintentarlo.');
    return;
  }
  // Solo la primera vez (base vacía) se rellenan los datos de la empresa.
  if (!(mem.ajustes && mem.ajustes.empresa)) {
    try { await db.collection('ajustes').doc('empresa').set(DEFAULT_EMPRESA); } catch (e) {}
  }
  cargarEnPantalla();
  cargarLogo();
  // Lo que llega de la app del equipo aparece solo: al volver a la gestión y cada minuto mientras está
  // a la vista. No se recarga con una ficha abierta, para no perder lo que se está escribiendo.
  let ultima = Date.now();
  marca = new Date(Date.now() - 120e3).toISOString();
  ultimaSync = Date.now(); pintarSync();
  const refrescar = async (minimo) => {
    if (document.hidden || Date.now() - ultima < minimo || !$('#overlay').hidden || !$('#login').hidden) return;
    ultima = Date.now();
    try { await sincronizar(); } catch (e) {}
  };
  document.addEventListener('visibilitychange', () => refrescar(30e3));
  setInterval(() => refrescar(55e3), 60e3);
})();
})();
</script>
