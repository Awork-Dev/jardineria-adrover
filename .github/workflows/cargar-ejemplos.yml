# Carga los datos de ejemplo (clientes, presupuestos, notas, operarios con PIN 1001-1003, fichajes, partes,
# gastos y fotos) para enseñar la aplicación. Se lanza a mano. Se borran desde la gestión con «Borrar ejemplos».
name: Cargar ejemplos

on:
  workflow_dispatch:

jobs:
  cargar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE: jardineria-adrover-gestion-eu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler@4.152.0
      - name: Clientes, presupuestos, notas, operarios, fichajes y partes
        run: |
          python3 ejemplos/semilla.py > ejemplos.sql
          wrangler d1 execute "$BASE" --remote --file ejemplos.sql --yes
      - name: Parte de hoy, gastos y fotos (por la app del equipo)
        run: python3 ejemplos/fotos.py https://equipo.jardineriaadrover.workers.dev
      - name: Un gasto ya pagado
        run: wrangler d1 execute "$BASE" --remote --command "UPDATE docs SET data = json_set(data, '$.estado', 'pagado') WHERE coleccion = 'gastos' AND id = 'gejmaterial'"
