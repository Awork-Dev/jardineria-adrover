# Publica en Cloudflare al subir cambios a main.
# Necesita en GitHub (Settings → Secrets and variables → Actions) los secretos
# CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: Publicar en Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "gestion/**"
      - "equipo/**"
      - "pruebas/**"
      - "compartido/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  cambios:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      gestion: ${{ steps.f.outputs.gestion }}
      equipo: ${{ steps.f.outputs.equipo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: f
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            for x in web gestion equipo; do echo "$x=true" >> "$GITHUB_OUTPUT"; done; exit 0
          fi
          c=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || printf 'web/\ngestion/\nequipo/\n')
          echo "$c" | grep -qE '^(web/|compartido/|\.github/)' && echo "web=true" >> "$GITHUB_OUTPUT" || true
          echo "$c" | grep -qE '^(gestion/|compartido/|pruebas/|\.github/)' && echo "gestion=true" >> "$GITHUB_OUTPUT" || true
          echo "$c" | grep -qE '^(equipo/|compartido/|pruebas/|\.github/)' && echo "equipo=true" >> "$GITHUB_OUTPUT" || true

  # Antes de publicar la gestión o la app del equipo, se pasan todas las pruebas (pruebas/correr.sh).
  # Si alguna falla, no se publica nada de esas dos apps.
  pruebas:
    needs: cambios
    if: needs.cambios.outputs.gestion == 'true' || needs.cambios.outputs.equipo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash pruebas/correr.sh

  web:
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.152.0"
          command: deploy

  gestion:
    needs: [cambios, pruebas]
    if: needs.cambios.outputs.gestion == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gestion
          wranglerVersion: "4.152.0"
          command: deploy

  equipo:
    needs: [cambios, pruebas]
    if: needs.cambios.outputs.equipo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: equipo
          wranglerVersion: "4.152.0"
          command: deploy
